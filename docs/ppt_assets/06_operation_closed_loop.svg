<text x="760" y="806" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="middle">这一页用来证明项目具备真实景区价值：不仅服务游客，还帮助管理方发现问题和优化资源。</text>
